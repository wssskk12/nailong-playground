      <ellipse cx="161" cy="265" rx="105" ry="15" fill="#e2a134" opacity=".25"/><path d="M230 180c42-13 55 13 35 31-13 12-32 11-46 6" fill="#ffc946" stroke="#b77721" stroke-width="5" stroke-linejoin="round"/><path d="M106 60q-15-26-2-42 20 6 27 29M185 52q6-32 25-35 12 21-1 44" fill="#ffdb64" stroke="#b77721" stroke-width="5" stroke-linejoin="round"/><path d="M152 45c62-5 104 39 103 109-1 69-41 105-99 104C95 260 50 221 48 158 47 90 89 51 152 45z" fill="#ffd14b" stroke="#b77721" stroke-width="6"/><ellipse cx="149" cy="197" rx="58" ry="48" fill="#ffe69a"/><path d="M72 166Q35 164 32 194q0 21 31 19" fill="#ffd14b" stroke="#b77721" stroke-width="6" stroke-linecap="round"/><path d="M230 162q28-14 40 3t-16 31" fill="#ffd14b" stroke="#b77721" stroke-width="6" stroke-linecap="round"/><path d="M106 244c-25 0-32 21-15 30h34l17-19M191 247c21-8 39 9 32 24h-38l-12-16" fill="#ffd14b" stroke="#b77721" stroke-width="6" stroke-linejoin="round"/><ellipse cx="100" cy="135" rx="10" ry="13" fill="#3e3020"/><ellipse cx="204" cy="135" rx="10" ry="13" fill="#3e3020"/><circle cx="97" cy="130" r="3" fill="#fff"/><circle cx="201" cy="130" r="3" fill="#fff"/><ellipse cx="77" cy="158" rx="16" ry="8" fill="#ffa370" opacity=".9"/><ellipse cx="224" cy="158" rx="16" ry="8" fill="#ffa370" opacity=".9"/><path d="M139 157q15 21 30 0" fill="none" stroke="#674020" stroke-width="6" stroke-linecap="round"/><path d="M144 171q11 8 20-2" fill="none" stroke="#db7a57" stroke-width="5" stroke-linecap="round"/><path d="M127 109q-9-6-17-3M195 105q-6-4-14 0" fill="none" stroke="#bb812d" stroke-width="4" stroke-linecap="round"/><path d="M37 62 44 74 58 76 46 84 43 98 36 85 23 79 36 74Z" fill="#fff8db"/><path d="M245 60 252 69 262 70 253 78 250 89 242 79 232 77 243 70Z" fill="#fff8db"/>

  <div class="hero-meta"><div class="meta-pill"><strong id="totalCount">12</strong> 款游戏收录</div><div class="meta-pill"><span class="dot"></span><strong id="onlineCount">5</strong> 个在线入口</div></div>
  <section class="section" id="featuredSection" aria-labelledby="featuredTitle"><div class="section-top"><div><div class="section-kicker">HANDPICKED FOR YOU</div><h2 id="featuredTitle">✦ 今日精选</h2><div class="section-note">随手一点，快乐开局</div></div><button id="randomButton" class="simple-link" style="background:none;border:0"> <svg width="17" height="17"><use href="#i-dice"/></svg> 随机玩一个</button></div><div id="featuredTrack" class="featured-track"></div></section>
  <section class="section" id="librarySection" aria-labelledby="libraryTitle"><div class="section-top"><div><div class="section-kicker" id="libraryKicker">EXPLORE ALL GAMES</div><h2 id="libraryTitle">全部小游戏 <span style="font-size:17px;color:#e7af58">✳</span></h2></div><button class="simple-link" id="resetButton" style="background:transparent;border:0" hidden>清除筛选 ↺</button></div>
    <div class="search"><svg width="20" height="20"><use href="#i-search"/></svg><input id="searchInput" type="search" autocomplete="off" aria-label="搜索小游戏" placeholder="搜索游戏名称、玩法…"><button class="clear-btn" id="clearSearch" aria-label="清除搜索">×</button></div>
    <div class="chips" id="filterChips" role="group" aria-label="游戏分类"></div>
    <div class="controls"><span class="result-count" id="resultCount" aria-live="polite"></span><select id="sortSelect" class="sort-select" aria-label="排序方式"><option value="recommended">精选排序 ▾</option><option value="name">名称排序 ▾</option><option value="online">在线优先 ▾</option></select></div>

<nav class="bottom-nav" aria-label="底部导航"><button class="nav-item active" data-nav="home"><svg><use href="#i-home"/></svg>首页</button><button class="nav-item" data-nav="categories"><svg><use href="#i-grid"/></svg>分类</button><button class="nav-item" data-nav="favorites"><svg><use href="#i-heart"/></svg>收藏</button></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dialog-scrim" id="dialogScrim" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-head"><h3 id="dialogTitle">游戏详情</h3><button class="dialog-close" id="dialogClose" aria-label="关闭详情">×</button></div><p id="dialogContent"></p><div id="dialogLinks" class="dialog-links"></div></div></div>
<script>
(() => {
  'use strict';
  const games = [
    {id:'run',name:'奶龙横向跑酷',description:'二段跳、翻滚和冲刺，越跑越停不下来。',genre:'动作跑酷',tags:['跑酷','动作'],emoji:'🏃',colors:['#fed8ab','#ffc16f'],kind:'online',play:'https://burning-frappuccino.github.io/nailong-run/',repo:'https://github.com/burning-frappuccino/nailong-run',featured:true},
    {id:'catch',name:'抓奶龙',description:'七格三消挑战！收集 32 种可爱造型。',genre:'休闲益智',tags:['消除','休闲'],emoji:'🧩',colors:['#c9e8fc','#a8d5fc'],kind:'online',play:'https://dailypotato.github.io/catch-nailong/',repo:'https://github.com/DailyPotato/catch-nailong',featured:true},
    {id:'match3',name:'奶龙消消乐',description:'20 个闯关地图，火箭、炸弹超爽连消。',genre:'趣味消除',tags:['消除','休闲'],emoji:'🍬',colors:['#fbcddd','#ffb9c9'],kind:'online',play:'https://lin51-q.github.io/nailong-match3/',repo:'https://github.com/Lin51-Q/nailong-match3',featured:true},
    {id:'bike',name:'奶龙海岸骑行',description:'沿着海边自由骑行，还有昼夜变化。',genre:'轻松休闲',tags:['休闲','动作'],emoji:'🚲',colors:['#b8eddb','#85d7bf'],kind:'online',play:'https://waffing.github.io/nailong-bike-20260929/?time=18.24&cam=orbit',repo:'https://github.com/Waffing/nailong-bike-20260929'},
    {id:'jump',name:'奶龙跳一跳',description:'按住蓄力，松开起跳！挑战更高分。',genre:'跳跃挑战',tags:['休闲','动作'],emoji:'🦘',colors:['#e8d0fb','#d4b7f6'],kind:'online',play:'https://9d68c3702df0498daa5772ea0f519a3a.bj8.agentos-app.net/',repo:'https://github.com/onifiguvono78-bot/nailon-jump-game'},
    {id:'merge',name:'合成大奶龙',description:'相同等级碰到一起，进化出新奶龙。',genre:'合成益智',tags:['合成','休闲'],emoji:'🍉',colors:['#c0f0c1','#9de3ab'],kind:'source',repo:'https://github.com/Liuhongchang06/nailong'},
    {id:'pop',name:'奶龙碰碰乐',description:'物理碰撞、十种形态，还有连击加分。',genre:'合成益智',tags:['合成','休闲'],emoji:'🎈',colors:['#ffe3a7','#ffd08b'],kind:'source',repo:'https://github.com/austinxzl/nailong-pop'},
    {id:'merge2',name:'奶龙合成所',description:'八阶段奶龙进化，越叠越刺激。',genre:'合成益智',tags:['合成','休闲'],emoji:'🪄',colors:['#ddd5ff','#c7bbff'],kind:'source',repo:'https://github.com/LVEG16/nailong-merge'},
    {id:'triple',name:'奶龙游戏三合一',description:'弹珠、跳一跳、摩天楼，三种玩法。',genre:'趣味合集',tags:['合集','休闲'],emoji:'🕹️',colors:['#bcecf2','#9de0e5'],kind:'source',repo:'https://github.com/1997minari0324/nailong'},
    {id:'food',name:'奶龙开饭啦',description:'45 秒抓住美食！Windows 离线版本。',genre:'反应挑战',tags:['休闲','离线'],emoji:'🍔',colors:['#ffd3c3','#ffb6a4'],kind:'offline',repo:'https://github.com/Jingpersonalworld/nailong-food-challenge'},
    {id:'dance',name:'奶龙舞林大闹狗熊岭',description:'八章 3D 剧情，斗舞探险欢乐不停。',genre:'音乐剧情',tags:['剧情','离线'],emoji:'🎵',colors:['#cbdcff','#aec7ff'],kind:'offline',repo:'https://github.com/Nicercz007-cloud/nailong-dance'},
    {id:'2048',name:'奶龙 2048',description:'2048 奶龙主题项目，仓库仍在规划开发。',genre:'数字益智',tags:['合成','开发中'],emoji:'🔢',colors:['#f9deb8','#f7c992'],kind:'source',repo:'https://github.com/dizhengxi691-hub/nailong-2048'}
  ];
  const icons = {heart:'<svg aria-hidden="true"><use href="#i-heart"/></svg>',arrow:'<svg aria-hidden="true"><use href="#i-arrow"/></svg>',external:'<svg aria-hidden="true"><use href="#i-external"/></svg>'};
  const typeLabel = {online:'在线入口',offline:'离线下载',source:'源码项目'};
  const chips = ['全部','在线试玩','动作','消除','合成','休闲','剧情','离线','合集'];
  const $ = s => document.querySelector(s);
  let activeCategory = '全部';
  let mode = 'home';
  let query = '';
  let sort = 'recommended';
  let toastTimeout;
  const favorites = new Set(read('nl_favorites',[]).filter(x=>games.some(g=>g.id===x)));
  function read(key,fallback){try{return JSON.parse(localStorage.getItem(key)) ?? fallback}catch{return fallback}}
  function save(){try{localStorage.setItem('nl_favorites',JSON.stringify([...favorites]))}catch{}}
  function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.classList.remove('show'),2200)}
  function updateFavCount(){const n=favorites.size;$('#favCount').textContent=n;$('#favCount').hidden=!n}
  function featured(){const styles=['f-orange','f-blue','f-pink'];$('#featuredTrack').innerHTML=games.filter(g=>g.featured).map((g,i)=>`<a class="feature ${styles[i]}" href="${g.play}" target="_blank" rel="noopener noreferrer" data-open="${g.id}" aria-label="在线试玩${g.name}"><div class="decor"></div><span class="feature-tag">✦ ${['人气挑战','趣味上头','休闲必玩'][i]}</span><h3>${g.name}</h3><p>${g.description}</p><span class="feature-icon" aria-hidden="true">${g.emoji}</span><span class="feature-go">立即开玩 <span class="feature-arrow">↗</span></span></a>`).join('')}
  function renderChips(){$('#filterChips').innerHTML=chips.map(c=>`<button type="button" class="chip ${activeCategory===c?'active':''}" data-category="${c}" aria-pressed="${activeCategory===c}">${c}</button>`).join('')}
  function matching(g){
    if(mode==='favorites'&&!favorites.has(g.id))return false;
    if(activeCategory==='在线试玩'&&g.kind!=='online')return false;
    if(activeCategory!=='全部'&&activeCategory!=='在线试玩'&&!g.tags.includes(activeCategory))return false;
    if(query&&!(`${g.name} ${g.description} ${g.genre} ${g.tags.join(' ')}`.toLocaleLowerCase().includes(query.toLocaleLowerCase())))return false;
    return true;
  }
  function tile(g){const liked=favorites.has(g.id);return `<article class="game-card"><div class="cover" style="--bg:linear-gradient(135deg,${g.colors[0]},${g.colors[1]})"><div class="cover-inner"><span class="cover-icon" aria-hidden="true">${g.emoji}</span><span class="cover-face" aria-hidden="true">✦</span></div><span class="cover-top-tag">${typeLabel[g.kind]}</span><button class="favorite ${liked?'active':''}" data-favorite="${g.id}" aria-label="${liked?'取消收藏':'收藏'}${g.name}" aria-pressed="${liked}">${icons.heart.replace('<svg','<svg '+(liked?'fill="currentColor"':''))}</button></div><div class="game-body"><h3 class="game-name">${g.name}</h3><p class="game-desc">${g.description}</p><div class="game-bottom"><div class="game-chips">${g.tags.slice(0,2).map(t=>`<span class="mini-chip"># ${t}</span>`).join('')}</div>${g.play?`<a class="game-action online" href="${g.play}" data-open="${g.id}" target="_blank" rel="noopener noreferrer">开始游戏 ${icons.arrow}</a>`:`<button class="game-action" data-details="${g.id}">查看项目 ${icons.external}</button>`}</div></div></article>`}
  function render(){renderChips();const items=games.filter(matching);if(sort==='name')items.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));else if(sort==='online')items.sort((a,b)=>(b.kind==='online')-(a.kind==='online'));
    $('#resultCount').innerHTML=`找到 <strong>${items.length}</strong> 款小游戏`;
    $('#gameGrid').innerHTML=items.length?items.map(tile).join(''):`<div class="empty"><div class="empty-emoji">${mode==='favorites'?'💛':'🔎'}</div><h3>${mode==='favorites'&&!favorites.size?'你的收藏夹还是空的':'暂时没找到小游戏'}</h3><p>${mode==='favorites'&&!favorites.size?'点击游戏封面右上角的爱心，就能把喜欢的游戏收好。':'换个关键词或分类，再找找吧。'}</p><button id="emptyReset">${mode==='favorites'?'发现游戏':'重置筛选'}</button></div>`;
    $('#featuredSection').hidden=mode==='favorites';$('#libraryTitle').innerHTML=mode==='favorites'?'我的收藏 <span style="color:#fb817e">♥</span>':'全部小游戏 <span style="font-size:17px;color:#e7af58">✳</span>';
    $('#libraryKicker').textContent=mode==='favorites'?'YOUR FAVORITE GAMES':'EXPLORE ALL GAMES';
    $('#resetButton').hidden=activeCategory==='全部'&&!query;
    updateFavCount();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===mode || (mode==='categories'&&b.dataset.nav==='categories')));
  }
  function nav(next){mode=next==='favorites'?'favorites':next==='categories'?'categories':'home';if(next==='home'){activeCategory='全部';query='';$('#searchInput').value='';}if(next==='favorites'){activeCategory='全部';query='';$('#searchInput').value='';}render();(next==='home'?$('#top'):$('#librarySection')).scrollIntoView({behavior:'smooth',block:'start'});if(next==='categories')setTimeout(()=>$('#filterChips').scrollIntoView({behavior:'smooth',block:'center'}),220)}
  function details(id){const g=games.find(x=>x.id===id);if(!g)return;$('#dialogTitle').textContent=g.name;$('#dialogContent').textContent=`${g.description} · ${g.genre}。${g.kind==='offline'?'本项目需要下载到电脑运行。':g.kind==='source'?'请在项目仓库查看使用说明与运行方式。':'可从公开试玩入口访问。'}`;$('#dialogLinks').innerHTML=`${g.play?`<a href="${g.play}" target="_blank" rel="noopener noreferrer" data-open="${g.id}">在线试玩 ↗</a>`:''}<a class="${g.play?'secondary':''}" href="${g.repo}" target="_blank" rel="noopener noreferrer">打开 GitHub 项目 ↗</a>`;$('#dialogScrim').classList.add('open');document.body.style.overflow='hidden';$('#dialogClose').focus()}
  function closeDialog(){$('#dialogScrim').classList.remove('open');document.body.style.overflow=''}
  function openRandom(){const available=games.filter(g=>g.play);const g=available[Math.floor(Math.random()*available.length)];recordOpen(g.id);const a=document.createElement('a');a.href=g.play;a.target='_blank';a.rel='noopener noreferrer';a.click();toast('已选中：'+g.name)}
  function recordOpen(id){try{localStorage.setItem('nl_last_open',id)}catch{}}
  document.addEventListener('click',e=>{
    const fav=e.target.closest('[data-favorite]');if(fav){const id=fav.dataset.favorite;if(favorites.has(id)){favorites.delete(id);toast('已取消收藏')}else{favorites.add(id);toast('已加入我的收藏 💛')}save();render();return;}
    const chip=e.target.closest('[data-category]');if(chip){activeCategory=chip.dataset.category;render();return;}
    const item=e.target.closest('[data-nav]');if(item){nav(item.dataset.nav);return;}
    const link=e.target.closest('[data-open]');if(link)recordOpen(link.dataset.open);
    const more=e.target.closest('[data-details]');if(more){details(more.dataset.details);return;}
    if(e.target.closest('#resetButton')||e.target.closest('#emptyReset')){if(mode==='favorites'&&e.target.closest('#emptyReset')){nav('home')}else{query='';activeCategory='全部';$('#searchInput').value='';render()}return;}
    if(e.target.closest('#clearSearch')){$('#searchInput').value='';query='';render();$('#searchInput').focus();return;}
  });
  $('#exploreButton').addEventListener('click',()=>nav('categories'));
  $('#headerFavorite').addEventListener('click',()=>nav('favorites'));
  $('#brandHome').addEventListener('click',e=>{e.preventDefault();nav('home')});
  $('#randomButton').addEventListener('click',openRandom);
  $('#searchInput').addEventListener('input',e=>{query=e.target.value.trim();$('#clearSearch').classList.toggle('visible',!!e.target.value);render()});
  $('#sortSelect').addEventListener('change',e=>{sort=e.target.value;render()});
  $('#dialogClose').addEventListener('click',closeDialog);
  $('#dialogScrim').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDialog()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
  $('#shareButton').addEventListener('click',async()=>{const data={title:'奶龙游乐场',text:'这里收集了好玩的奶龙小游戏～',url:location.href};try{if(navigator.share){await navigator.share(data)}else if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(location.href);toast('网页链接已复制')}else{toast('打开浏览器菜单，选择“分享”即可')}}catch(err){if(err.name!=='AbortError')toast('分享暂不可用，请用浏览器菜单分享')}});
  $('#totalCount').textContent=games.length;$('#onlineCount').textContent=games.filter(g=>g.play).length;featured();render();
})();
</script>
</body>
